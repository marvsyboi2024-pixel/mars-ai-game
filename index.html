<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <title>Mars AI Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" data-action="home" aria-label="Home">⌂</button>
      <div>
        <div class="brand">MARS AI</div>
        <div class="subtitle">GAME HUB</div>
      </div>
      <button class="icon-btn" data-action="profile" aria-label="Profile">◉</button>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-route="home">⌂<span>Home</span></button>
      <button data-route="games">🎮<span>Games</span></button>
      <button data-route="missions">🎯<span>Missions</span></button>
      <button data-route="leaderboard">🏆<span>Ranks</span></button>
      <button data-route="profile">👤<span>Profile</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
